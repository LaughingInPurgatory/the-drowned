# Build the installer on a GitHub-hosted runner and attach it to a release.
# Trigger: push a version tag (v0.1.0) or manual workflow_dispatch.
#
# macOS arm64 only for now. Adding linux/windows back is a matter of restoring
# the matrix — see the commented block at the bottom.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload to (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Test
        run: >-
          node --test
          src/renderer/game/*.test.js
          src/renderer/procgen/*.test.js
          src/renderer/data/*.test.js
          src/renderer/world/*.test.js

      - name: Build + package
        # --publish never: electron-builder auto-publishes (and uploads its own
        # latest*.yml / .blockmap update-metadata) whenever it sees a GH token —
        # we only want the explicit "Upload to release" step below to touch the
        # release, with just the .dmg matched by `files`.
        #
        # identity=null + CSC_IDENTITY_AUTO_DISCOVERY=false: the build is
        # unsigned, so macOS will quarantine it on first open. That is expected
        # until there is a Developer ID to sign with.
        run: npx electron-vite build && npx electron-builder --mac --arm64 -c.mac.identity=null --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: 'release/*.dmg'
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
