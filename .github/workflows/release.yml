# Build installers on GitHub-hosted runners and attach them to a release.
# Trigger: push a version tag (v0.3.2) or manual workflow_dispatch.
#
# Platforms:
#   - macOS arm64 DMG (ad-hoc signed)
#   - Linux AppImage x64 + arm64
#   - Windows NSIS x64 + arm64
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload to (e.g. v0.3.2)'
        required: true
        default: 'v0.3.2'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 -c.mac.identity=null
            artifacts: 'release/*.dmg'
          - os: ubuntu-latest
            args: --linux AppImage --x64
            artifacts: 'release/*.AppImage'
          - os: ubuntu-24.04-arm
            args: --linux AppImage --arm64
            artifacts: 'release/*.AppImage'
          # Separate jobs so each arch produces a distinctly named installer
          # (combined --x64 --arm64 only uploaded one Setup.exe).
          - os: windows-latest
            args: --win nsis --x64
            artifacts: 'release/*.exe'
          - os: windows-latest
            args: --win nsis --arm64
            artifacts: 'release/*.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Test
        # bash so globs expand on Windows (PowerShell leaves *.test.js literal).
        shell: bash
        run: >-
          node --test
          src/renderer/game/*.test.js
          src/renderer/procgen/*.test.js
          src/renderer/data/*.test.js
          src/renderer/world/*.test.js

      - name: Build + package
        # --publish never: electron-builder auto-publishes whenever it sees a
        # GH token — we only want the explicit Upload step to touch the release.
        #
        # mac: identity=null + CSC_IDENTITY_AUTO_DISCOVERY=false → unsigned /
        # ad-hoc (afterSign). Gatekeeper will quarantine on first open until
        # there is a Developer ID.
        run: npx electron-vite build && npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
